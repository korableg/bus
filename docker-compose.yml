services:
  kafka:
    container_name: kafka
    image: apache/kafka:4.4.0
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    networks:
      - dev_net
    healthcheck:
      test: /opt/kafka/bin/kafka-topics.sh --list --bootstrap-server localhost:9092 || exit 1
      interval: 3s
      timeout: 20s
      retries: 10
  
  # kafka-ui:
  #   container_name: kafka-ui
  #   image: provectuslabs/kafka-ui:latest
  #   ports:
  #     - 8080:8080
  #   depends_on:
  #     kafka:
  #       condition: service_healthy
  #   environment:
  #     KAFKA_CLUSTERS_0_NAME: local
  #     KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
  #     KAFKA_CLUSTERS_0_METRICS_PORT: 9998
  #     DYNAMIC_CONFIG_ENABLED: 'true'
  #   networks:
  #     - dev_net
  
  kafka_topics:
    container_name: kafka_topics
    image: apache/kafka:4.4.0
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - dev_net
    command: >
      sh -c "/opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic test_topic --partitions 3 --replication-factor 1 --bootstrap-server kafka:9092
      && /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic test_topic_2 --bootstrap-server kafka:9092"

networks:
  dev_net:
    driver: bridge
